<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alsace Wine Matcher</title>
<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#24221f; --muted:#746f67;
  --wine:#72243b; --wine2:#9c3e59; --gold:#c59a55; --line:#e7dfd2;
  --green:#526b58; --shadow:0 18px 50px rgba(52,39,25,.10);
}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 85% 0%,#efe4d2 0,transparent 32%),var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1080px;margin:auto;padding:34px 20px 60px}
header{text-align:center;padding:22px 0 30px}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;color:var(--wine);font-size:11px;font-weight:700}
h1{font-family:Georgia,serif;font-size:clamp(38px,7vw,68px);line-height:.95;margin:10px 0 12px;font-weight:500}
.subtitle{color:var(--muted);max-width:620px;margin:auto;font-size:17px}
.mode-toggle{display:flex;justify-content:center;margin:24px auto 28px}
.toggle-track{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(560px,100%);padding:5px;background:#ddd3c5;border:1px solid #d0c4b4;border-radius:18px;box-shadow:inset 0 1px 2px #00000008}
.toggle-thumb{position:absolute;z-index:0;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:13px;background:var(--wine);box-shadow:0 5px 14px rgba(114,36,59,.28);transition:transform .22s ease}
.toggle-track.food .toggle-thumb{transform:translateX(100%)}
.toggle-option{position:relative;z-index:1;border:0;background:transparent;padding:14px 16px;border-radius:13px;font-weight:800;color:#686159;cursor:pointer;font-size:15px;transition:color .18s ease}
.toggle-option.active{color:white}
.toggle-option:not(.active):hover{color:var(--wine)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:8px}
select,input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-size:15px;outline:none}
select:focus,input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c59a5520}
.search-wrap{position:relative}
.search-results{position:absolute;z-index:10;left:0;right:0;top:calc(100% + 5px);background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(52,39,25,.12);overflow:hidden;display:none}
.search-results.show{display:block}
.search-result{width:100%;border:0;border-bottom:1px solid #f0ebe4;background:white;text-align:left;padding:11px 13px;cursor:pointer;color:var(--ink)}
.search-result:last-child{border-bottom:0}
.search-result:hover{background:#f7f1e9;color:var(--wine)}
.field{margin-bottom:18px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;cursor:pointer;color:#514b44}
.chip.selected{background:#f2e5e8;border-color:#d5a4b2;color:var(--wine);font-weight:700}
.cta{width:100%;border:0;border-radius:13px;padding:14px;background:var(--wine);color:white;font-weight:800;font-size:15px;cursor:pointer}
.cta:hover{background:var(--wine2)}
.result{margin-top:22px;background:linear-gradient(135deg,#fffdf9,#f5ede4);border:1px solid var(--line);border-radius:24px;padding:26px;display:none}
.result.show{display:block}
.result-top{display:flex;justify-content:space-between;gap:20px;align-items:start}
.kicker{color:var(--wine);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.result h2{font-family:Georgia,serif;font-size:34px;font-weight:500;margin:5px 0}
.score{font-size:28px;font-weight:800;color:var(--wine);white-space:nowrap}.score small{font-size:12px;color:var(--muted);font-weight:600}
.reason{color:var(--muted);max-width:720px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.barbox{background:white;border:1px solid var(--line);border-radius:14px;padding:13px}.barbox span{font-size:11px;color:var(--muted)}.bar{height:7px;background:#eee7de;border-radius:9px;margin-top:8px;overflow:hidden}.fill{height:100%;background:var(--wine);border-radius:9px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.pick{background:white;border:1px solid var(--line);border-radius:16px;padding:15px}.pick b{font-family:Georgia,serif;font-size:20px;font-weight:500}.pick .mini{font-size:12px;color:var(--muted);margin-top:3px}
footer{text-align:center;color:#91897f;font-size:12px;margin-top:26px}
@media(max-width:720px){.grid,.bars,.picks{grid-template-columns:1fr}.result-top{display:block}.score{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="eyebrow">Vin · mad · Alsace</div>
  <h1>Alsace Wine Matcher</h1>
  <div class="subtitle">Find det perfekte match mellem Alsace-vin og mad – fra ost og skaldyr til kylling og tarte flambée.</div>
</header>

<div class="mode-toggle" role="group" aria-label="Vælg søgemåde">
  <div class="toggle-track" id="modeToggle">
    <div class="toggle-thumb" id="toggleThumb"></div>
    <button id="wineMode" class="toggle-option active" onclick="setMode('wine')">🍇 Jeg har en vin</button>
    <button id="foodMode" class="toggle-option" onclick="setMode('food')">🍽️ Jeg skal spise</button>
  </div>
</div>

<div class="panel" id="formPanel"></div>
<div class="result" id="result"></div>
<footer>Første version · Matchene er kulinariske tommelfingerregler – ikke vinlov.</footer>
</div>

<script>
const wines = {
 Riesling:{style:"Frisk, tør og mineralsk", acid:95, body:45, aroma:72, foods:["Fisk & skaldyr","Choucroute","Sushi","Gedeost","Svinekød","Tarte flambée"],why:"Høj syre og citrus/mineralsk friskhed gør den fantastisk til salt, fedme og delikate råvarer.", tip:"Prøv den til choucroute eller østers – to klassikere, hvor syren virkelig får lov at arbejde."},
 "Gewurztraminer":{style:"Aromatisk, krydret og fyldig",acid:55,body:82,aroma:98,foods:["Krydret asiatisk","Munster","Foie gras","Thai","Curry","Dessert med frugt"],why:"Den intense duft og lave syre elsker krydderi, stærke aromaer og kraftige oste.",tip:"Gewurztraminer + Munster er en af Alsaces mest ikoniske kombinationer."},
 "Pinot Gris":{style:"Fyldig, rund og let krydret",acid:65,body:88,aroma:78,foods:["Raclette","Svinekød","Svampe","Fjerkræ","Kalv","Fyldige saucer"],why:"Mere krop og moden frugt gør Pinot Gris velegnet til cremede, ristede og fyldige retter.",tip:"Til raclette er den fylde, du leder efter – men behold gerne lidt friskhed."},
 "Pinot Blanc":{style:"Blød, frisk og alsidig",acid:72,body:58,aroma:55,foods:["Fisk","Kylling","Pasta","Salater","Quiche","Lette oste"],why:"Diskret aromatik og friskhed gør den til en af de mest fleksible Alsace-vine ved bordet.",tip:"Et sikkert valg, når retten er mild og du ikke vil have vinen til at overdøve maden."},
 Sylvaner:{style:"Tør, frisk og urteagtig",acid:82,body:45,aroma:58,foods:["Asparges","Salater","Fisk","Skaldyr","Grønne grøntsager","Let frokost"],why:"Friskhed og urteagtige noter spiller flot sammen med grønne grøntsager og lette retter.",tip:"Sylvaner til asparges er et klassisk forårs-match."},
 Muscat:{style:"Aromatisk, floral og frisk",acid:70,body:48,aroma:96,foods:["Asiatisk mad","Aperitif","Asparges","Friske salater","Melon","Let krydret"],why:"Den parfumerede, drueagtige karakter gør den spændende til aromatiske og let krydrede retter.",tip:"Server den godt afkølet som aperitif eller til grønne, aromatiske retter."},
 "Pinot Noir":{style:"Rød, saftig og elegant",acid:72,body:62,aroma:78,foods:["And","Svampe","Kalv","Grillet fjerkræ","Charcuterie","Bløde oste"],why:"Den elegante røde frugt og moderate tannin fungerer godt med lyst kød og jordagtige smage.",tip:"Prøv den til and med svampe eller en god charcuterie-tallerken."},
 "Crémant d’Alsace":{style:"Mousserende, frisk og sprød",acid:90,body:42,aroma:65,foods:["Aperitif","Østers","Friture","Skaldyr","Tapas","Cremede snacks"],why:"Bobler og syre renser ganen og gør Crémant ekstremt anvendelig før og under måltidet.",tip:"Friture + bobler er næsten altid en god idé."}
};

const foodMap = {
 "Raclette":["Pinot Gris","Riesling","Pinot Blanc"],
 "Choucroute":["Riesling","Sylvaner","Pinot Blanc"],
 "Tarte flambée":["Riesling","Pinot Blanc","Crémant d’Alsace"],
 "Munster":["Gewurztraminer","Pinot Gris","Riesling"],
 "Foie gras":["Gewurztraminer","Pinot Gris","Riesling"],
 "Fisk & skaldyr":["Riesling","Crémant d’Alsace","Pinot Blanc"],
 "Østers":["Riesling","Crémant d’Alsace","Sylvaner"],
 "Asiatisk / Thai":["Gewurztraminer","Riesling","Muscat"],
 "Svampe":["Pinot Gris","Pinot Noir","Riesling"],
 "And":["Pinot Noir","Pinot Gris","Riesling"],
 "Asparges":["Sylvaner","Riesling","Pinot Blanc"],
 "Charcuterie":["Pinot Noir","Crémant d’Alsace","Pinot Blanc"]
};

let mode="wine";
function setMode(m){
  mode=m;
  document.getElementById("wineMode").classList.toggle("active",m==="wine");
  document.getElementById("foodMode").classList.toggle("active",m==="food");
  document.getElementById("modeToggle").classList.toggle("food",m==="food");
  renderForm();
}
function renderForm(){
 const p=document.getElementById("formPanel");
 if(mode==="wine"){
  p.innerHTML=`<div class="grid">
   <div class="field"><label>Drue / vintype</label><select id="wine">${Object.keys(wines).map(x=>`<option>${x}</option>`).join("")}</select></div>
   <div class="field"><label>Stil</label><select id="style"><option>Tør</option><option>Aromatisk</option><option>Fyldig</option><option>Mousserende</option></select></div>
  </div>
  <div class="field"><label>Hvad vil du spise?</label><div class="chips" id="foodChips">${[...new Set(Object.values(wines).flatMap(x=>x.foods))].slice(0,12).map(x=>`<button class="chip" onclick="toggleChip(this)">${x}</button>`).join("")}</div></div>
  <button class="cta" onclick="matchWine()">Find madmatch →</button>`;
 }else{
  p.innerHTML=`<div class="field"><label>Hvad skal du spise?</label>
    <div class="search-wrap">
      <input id="custom" autocomplete="off" placeholder="Søg fx raclette, fisk, kylling, gedeost…" aria-label="Søg efter mad eller råvare">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <div class="field"><label>Eller vælg en klassiker</label><div class="chips" id="foodChips">${Object.keys(foodMap).slice(0,8).map(x=>`<button class="chip" onclick="chooseFood(this)">${x}</button>`).join("")}</div></div>
  <button class="cta" onclick="matchFood()">Find min Alsace-vin →</button>`;
  setupFoodSearch();
 }
}
function toggleChip(el){el.classList.toggle("selected")}
function showResult(title,score,why,tip,labels){
 const r=document.getElementById("result");
 r.innerHTML=`<div class="result-top"><div><div class="kicker">Dit match</div><h2>${title}</h2><div class="reason">${why}</div></div><div class="score">${score}% <small>match</small></div></div>
 <div class="bars">${labels.map((x,i)=>`<div class="barbox"><span>${x[0]}</span><div class="bar"><div class="fill" style="width:${x[1]}%"></div></div></div>`).join("")}</div>
 <strong>🍷 Alsace-tip</strong><p class="reason">${tip}</p>`;
 r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function matchWine(){
 const w=wines[document.getElementById("wine").value];
 const selected=[...document.querySelectorAll(".chip.selected")].map(x=>x.textContent);
 let score=selected.length?Math.min(98,82+selected.filter(x=>w.foods.includes(x)).length*6):91;
 showResult(document.getElementById("wine").value,score,w.why,w.tip,[["Syre",w.acid],["Fylde",w.body],["Aromatik",w.aroma]]);
}
function chooseFood(el){
  document.querySelectorAll("#foodChips .chip").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  const input=document.getElementById("custom");
  if(input) input.value=el.textContent;
}
function setupFoodSearch(){
  const input=document.getElementById("custom"), box=document.getElementById("searchResults");
  if(!input || !box) return;
  const all=[...new Set([...Object.keys(foodMap), ...Object.values(wines).flatMap(x=>x.foods)])];
  function update(){
    const q=input.value.trim().toLowerCase();
    if(!q){box.classList.remove("show");box.innerHTML="";return;}
    const matches=all.filter(x=>x.toLowerCase().includes(q)).slice(0,7);
    box.innerHTML=matches.length ? matches.map(x=>`<button class="search-result" onclick="pickSearchResult('${x.replace(/'/g,"\\\\'")}')">${x}</button>`).join("") :
      `<div class="search-result" style="cursor:default;color:var(--muted)">Ingen direkte match – prøv alligevel.</div>`;
    box.classList.add("show");
  }
  input.addEventListener("input",update);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();box.classList.remove("show");matchFood();}});
  input.addEventListener("focus",()=>{if(input.value) update();});
  document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap")) box.classList.remove("show");});
}
function pickSearchResult(value){
  const input=document.getElementById("custom");
  input.value=value;
  document.getElementById("searchResults").classList.remove("show");
  input.focus();
}
function matchFood(){
 const custom=document.getElementById("custom")?.value.trim() || "";
 const food=custom || "";
 let picks=foodMap[food]||[];
 if(!picks && foodMap[Object.keys(foodMap).find(k=>k.toLowerCase()===food.toLowerCase())]) picks=foodMap[Object.keys(foodMap).find(k=>k.toLowerCase()===food.toLowerCase())];
 if(custom){
   const s=custom.toLowerCase();
   if(/ost|munster|raclette|brie/.test(s)) picks=["Gewurztraminer","Pinot Gris","Riesling"];
   else if(/fisk|reje|østers|skaldyr|laks/.test(s)) picks=["Riesling","Crémant d’Alsace","Pinot Blanc"];
   else if(/svin|flæsk|bacon/.test(s)) picks=["Riesling","Pinot Gris","Pinot Blanc"];
   else if(/kylling|and|fjerkræ/.test(s)) picks=["Pinot Gris","Pinot Noir","Riesling"];
   else if(/svamp/.test(s)) picks=["Pinot Gris","Pinot Noir","Riesling"];
   else picks=["Riesling","Pinot Blanc","Crémant d’Alsace"];
 }
 const best=picks[0], w=wines[best];
 showResult(best+" · bedste valg",95,w.why,w.tip,picks.slice(0,3).map((x,i)=>[x,i===0?96:88-i*6]));
 const r=document.getElementById("result");
 r.innerHTML += `<div class="picks">${picks.slice(0,3).map((x,i)=>`<div class="pick"><div class="kicker">#${i+1}</div><b>${x}</b><div class="mini">${wines[x].style}</div></div>`).join("")}</div>`;
}
renderForm();
</script>
</body>
</html>
